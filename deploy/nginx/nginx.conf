upstream backend_api {
    server backend-api:8000;
}

upstream staff_app {
    server staff-app:80;
}

upstream customer_sign {
    server customer-sign:80;
}

upstream admin_dashboard {
    server admin-dashboard:80;
}

# Single-domain path-based routing — dryclean.synmodel.com
server {
    listen 80;
    server_name dryclean.synmodel.com localhost;
    client_max_body_size 10M;

    # API
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage (photos)
    location /storage/ {
        proxy_pass http://backend_api/storage/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Customer sign app (/sign/)
    # Strips /sign/ prefix → container receives /
    location /sign/ {
        proxy_pass http://customer_sign/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin dashboard (/admin/)
    # Strips /admin/ prefix → container receives /
    location /admin/ {
        proxy_pass http://admin_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff app (root — catch all)
    location / {
        proxy_pass http://staff_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default — return 444 for unmatched hosts
server {
    listen 80 default_server;
    return 444;
}
