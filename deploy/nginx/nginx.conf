upstream backend_api {
    server backend-api:8000;
}

upstream staff_app {
    server staff-app:80;
}

upstream customer_sign {
    server customer-sign:80;
}

# Single-domain path-based routing — dryclean.synmodel.com
server {
    listen 80 default_server;
    server_name _;  # accept any hostname (enables Codespaces port-forwarding);
    client_max_body_size 20M;

    # API — extended timeout for background AI detection polling
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow long AI detection jobs (background thread + polling, but uploads can be slow)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Storage (photos)
    location /storage/ {
        proxy_pass http://backend_api/storage/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Customer sign app (/sign/)
    location /sign/ {
        proxy_pass http://customer_sign/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff app — root and all SPA paths (/admin is handled inside staff-app via React Router)
    location / {
        proxy_pass http://staff_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# (catch-all removed — default_server moved to main block above)
